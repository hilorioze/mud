on:
  push:
    branches: &branches
      - main

  pull_request:
    branches: *branches

  workflow_dispatch:

jobs:
  test:
    concurrency:
      # one run per pull request status; latest completes last
      group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && 'pr' || 'non-pr' }}

      cancel-in-progress: false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            fsync-metadata = false # performance over durability in CI; store is transient

      - run: nix run nixpkgs#devenv -- test

      - run: nix build --no-link --print-build-logs
