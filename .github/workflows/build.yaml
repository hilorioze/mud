on:
  push:
    branches: &branches
      - main

    paths: &paths
      - .github/workflows/build.yaml

      - src/**
      - pyproject.toml
      - uv.lock

      # workflow reads `nixConfig` and uses `--inputs-from .`, so changes to them may affect the result
      - flake.nix
      - flake.lock

  pull_request:
    branches: *branches

    paths: *paths

  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          # no `ubuntu-latest-arm` alias; pinned to `ubuntu-24.04-arm`
          # update when a newer image or the alias becomes available
          # keep-sorted start block=yes newline_separated=yes
          - system: aarch64-linux
            runner: ubuntu-24.04-arm

          - system: x86_64-linux
            runner: ubuntu-latest
          # keep-sorted end

      fail-fast: false # don't cancel the matrix if one job fails

    concurrency:
      # one run per ref and system; latest cancels older runs
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.system }}

      cancel-in-progress: true

    permissions:
      id-token: write # required so `niks3` can authenticate via OIDC

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hilorioze/nixos-dotfiles/.github/actions/setup-nix@main

      - uses: hilorioze/nixos-dotfiles/.github/actions/setup-niks3@main

      - run: nix build --no-link --print-build-logs .#packages.${{ matrix.system }}.default
