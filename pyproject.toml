[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mud"
version = "0.1.0"

authors = [{name = "hilorioze", email = "hilorioze@hilorioze.com"}]
license = "MIT"

description = "small multiplayer text game played over telnet"
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    # keep-sorted start
    "adaptix>=3.0.0b12",
    "telnetlib3>=5.0.1",
    "wcwidth>=0.9.4",
    # keep-sorted end
]

[project.scripts]
mud = "mud.__main__:main"

[dependency-groups]
dev = [
    # keep-sorted start
    "pytest-asyncio>=1.4.0",
    "pytest>=9.1.1",
    # keep-sorted end
]

